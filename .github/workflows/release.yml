name: release

# Tag push → VSIX → GitHub release. Tag must match package.json's version;
# leading v optional (0.1.0 or v0.1.0).

on:
  push:
    tags: ['v*', '[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $GITHUB_REF_NAME is $tag but package.json is $ver"
            exit 1
          fi
      - run: npm ci
      - name: Compile
        run: npm run compile
      - name: Package VSIX
        run: npx --yes @vscode/vsce package
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --generate-notes
